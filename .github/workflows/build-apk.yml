name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Generate debug keystore in workspace
        run: |
          keytool -genkey -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Keystore: $GITHUB_WORKSPACE/debug.keystore"

      - name: Inject keystore into export_presets.cfg
        run: |
          KEYSTORE="$GITHUB_WORKSPACE/debug.keystore"
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$KEYSTORE\"|g" export_presets.cfg
          sed -i "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|g" export_presets.cfg
          sed -i "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|g" export_presets.cfg
          echo "Keystore lines in preset:"
          grep keystore export_presets.cfg

      - name: Export with Godot
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz"
          relative_project_path: "./"
          archive_output: false
          export_debug: true
          use_preset_export_path: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceInvadersPro-APK
          path: builds/SpaceInvadersPro.apk
          retention-days: 30
