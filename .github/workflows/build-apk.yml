name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "SpaceInvadersPro"

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: abarichello/godot-ci:4.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK path for Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << 'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          EOF

      - name: Create builds directory
        run: mkdir -p builds

      - name: Export APK (debug)
        run: |
          godot --headless --export-debug "Android" "builds/${{ env.EXPORT_NAME }}.apk" 2>&1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-APK
          path: builds/${{ env.EXPORT_NAME }}.apk
          retention-days: 30
