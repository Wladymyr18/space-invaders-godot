name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          sudo install "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates (correct path)
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          mkdir -p "$TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TEMPLATES_DIR/"
          echo "Templates installed:"
          ls "$TEMPLATES_DIR" | grep -i android

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure editor settings
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          python3 -c "
          import os
          sdk  = os.environ.get('ANDROID_SDK_ROOT', '/usr/local/lib/android/sdk')
          java = os.environ.get('JAVA_HOME', '/usr/lib/jvm/temurin-11-jdk-amd64')
          home = os.path.expanduser('~')
          ws   = os.environ.get('GITHUB_WORKSPACE', '')
          lines = [
            '[gd_resource type=\"EditorSettings\" format=3]',
            '',
            '[resource]',
            'export/android/android_sdk_path = \"' + sdk  + '\"',
            'export/android/java_sdk_path = \"'    + java + '\"',
            'export/android/debug_keystore = \"'   + ws + '/debug.keystore\"',
            'export/android/debug_keystore_user = \"androiddebugkey\"',
            'export/android/debug_keystore_pass = \"android\"',
          ]
          path = home + '/.config/godot/editor_settings-4.tres'
          os.makedirs(os.path.dirname(path), exist_ok=True)
          open(path, 'w').write('\n'.join(lines) + '\n')
          print('Settings written to', path)
          "

      - name: Inject keystore into export_presets.cfg
        run: |
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$GITHUB_WORKSPACE/debug.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|g" export_presets.cfg
          sed -i "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|g" export_presets.cfg
          grep keystore export_presets.cfg

      - name: Import project
        run: timeout 60 godot --headless --import 2>&1 || true

      - name: Re-apply editor settings (import may reset them)
        run: |
          python3 -c "
          import os
          sdk  = os.environ.get('ANDROID_SDK_ROOT', '/usr/local/lib/android/sdk')
          java = os.environ.get('JAVA_HOME', '/usr/lib/jvm/temurin-11-jdk-amd64')
          home = os.path.expanduser('~')
          ws   = os.environ.get('GITHUB_WORKSPACE', '')
          lines = [
            '[gd_resource type=\"EditorSettings\" format=3]',
            '',
            '[resource]',
            'export/android/android_sdk_path = \"' + sdk  + '\"',
            'export/android/java_sdk_path = \"'    + java + '\"',
            'export/android/debug_keystore = \"'   + ws + '/debug.keystore\"',
            'export/android/debug_keystore_user = \"androiddebugkey\"',
            'export/android/debug_keystore_pass = \"android\"',
          ]
          path = home + '/.config/godot/editor_settings-4.tres'
          open(path, 'w').write('\n'.join(lines) + '\n')
          print('Settings re-applied')
          "

      - name: Export APK
        run: |
          mkdir -p builds
          godot --headless --export-debug "Android" "$GITHUB_WORKSPACE/builds/SpaceInvadersPro.apk" 2>&1

      - name: Verify APK
        run: ls -lh builds/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpaceInvadersPro-APK
          path: builds/SpaceInvadersPro.apk
          retention-days: 30
