name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.2.2"
  EXPORT_NAME: "SpaceInvadersPro"

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip"
          sudo install "Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Install export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable"
          mkdir -p "$TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-stable/Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz"
          unzip -q "Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TEMPLATES_DIR/"

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot editor settings
        run: |
          ANDROID_SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          JAVA_HOME_PATH="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which java))))}"
          echo "Android SDK: $ANDROID_SDK"
          echo "Java home:   $JAVA_HOME_PATH"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" << SETTINGS
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_SDK"
export/android/java_sdk_path = "$JAVA_HOME_PATH"
export/android/debug_keystore = "$HOME/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
SETTINGS
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Inject keystore into export_presets.cfg
        run: |
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$HOME/.android/debug.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/debug_user=\"\"|keystore/debug_user=\"androiddebugkey\"|g" export_presets.cfg
          sed -i "s|keystore/debug_password=\"\"|keystore/debug_password=\"android\"|g" export_presets.cfg

      - name: Import project resources
        run: |
          timeout 120 godot --headless --import 2>&1 || true

      - name: Export APK
        run: |
          mkdir -p builds
          godot --headless --export-debug "Android" "builds/${{ env.EXPORT_NAME }}.apk" 2>&1

      - name: Verify APK exists
        run: ls -lh builds/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXPORT_NAME }}-APK
          path: builds/${{ env.EXPORT_NAME }}.apk
          retention-days: 30
